---
# Managed by Terraform : Changes will be overwritten. Do not edit manually
name: Check Pull Request Labels
on:
  pull_request:
    types: [opened, labeled, unlabeled, synchronize]
jobs:
  label:
    name: check_pr_labels
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/github-script@v8
        with:
          script: |
            const blockedLabels = ['do not merge', 'WIP'];
            const prLabels = context.payload.pull_request.labels.map(l => l.name);
            const found = blockedLabels.filter(l => prLabels.includes(l));
            if (found.length > 0) {
              core.setFailed(`PR has blocked label(s): $${found.join(', ')}`);
            }
